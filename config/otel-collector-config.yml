receivers:
  fluentforward:
    endpoint: 0.0.0.0:24224
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317
connectors:
  routing:
    default_pipelines: [ logs/log ]
    table:
    - context: resource
      condition: attributes["log.type"] == "audit"
      pipelines: [ logs/audit, logs/kafka-audit ]
    - context: resource
      condition: attributes["log.type"] == "filter_log"
      pipelines: [ logs/filter-alert ]
    - context: resource
      condition: attributes["log.type"] == "alert_log"
      pipelines: [ logs/filter-alert ]
    - context: resource
      condition: attributes["log.type"] == "log"
      pipelines: [ logs/log, logs/kafka-log ]
processors:
  transform/extract-resource:
    error_mode: ignore
    log_statements:
    - context: log
      # Agent-shipped logs (Fluent Bit `tail`) cannot write resource attributes, so they
      # carry them inside the body instead. Records that already have a resource
      # service.name came from a native OTLP SDK and are left completely alone.
      conditions:
      - IsMap(log.body) and resource.attributes["service.name"] == nil and log.body["service.name"] != nil
      statements:
      - set(resource.attributes["service.name"], log.body["service.name"])
      - set(resource.attributes["service.version"], log.body["service.version"]) where log.body["service.version"] != nil
      - set(resource.attributes["log.type"], log.body["log.type"]) where log.body["log.type"] != nil
      # Keep an unrecognised level verbatim rather than losing it, then fold the three
      # levels we know onto the vocabulary the SDKs emit — SeverityText is filtered by
      # exact string (CoreApi FeedbackConfig.AllowedLevels = "Warning,Error"), so "WARN"
      # would make a frontend error invisible to it.
      - set(log.severity_text, log.body["severity_text"]) where log.body["severity_text"] != nil
      - set(log.severity_text, "Information") where log.body["severity_text"] == "INFO"
      - set(log.severity_number, SEVERITY_NUMBER_INFO) where log.body["severity_text"] == "INFO"
      - set(log.severity_text, "Warning") where log.body["severity_text"] == "WARN"
      - set(log.severity_number, SEVERITY_NUMBER_WARN) where log.body["severity_text"] == "WARN"
      - set(log.severity_text, "Error") where log.body["severity_text"] == "ERROR"
      - set(log.severity_number, SEVERITY_NUMBER_ERROR) where log.body["severity_text"] == "ERROR"
      - delete_key(log.body, "service.name")
      - delete_key(log.body, "service.version")
      - delete_key(log.body, "log.type")
      - delete_key(log.body, "severity_text")
  batch:
    send_batch_size: 10000
    timeout: 1s
  memory_limiter:
    check_interval: 2s
    limit_mib: 1800
    spike_limit_mib: 500
extensions:
  health_check:
  pprof:
    endpoint: :1888
  zpages:
    endpoint: :55679
exporters:
  clickhouse/default:
    endpoint: tcp://clickhouse:9000
    database: default
    ttl: 72h
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    username: default
    password: ${SERVICE_PASSWORD}
  clickhouse/audit:
    endpoint: tcp://clickhouse:9000
    database: default
    ttl: 0
    logs_table_name: otel_audits
    username: default
    password: ${SERVICE_PASSWORD}
  clickhouse/otel_filter_alert_logs:
    endpoint: tcp://clickhouse:9000
    database: default
    ttl: 0
    logs_table_name: otel_filter_alert_logs
    username: default
    password: ${SERVICE_PASSWORD}
  kafka/logs:
    brokers: [ "kafka-1:9092", "kafka-2:9092" ]
    topic: otel-logs
    encoding: otlp_json
    protocol_version: 2.6.0
  kafka/metrics:
    brokers: [ "kafka-1:9092", "kafka-2:9092" ]
    topic: otel-metrics
    encoding: otlp_json
    protocol_version: 2.6.0
  kafka/audits:
    brokers: [ "kafka-1:9092", "kafka-2:9092" ]
    topic: otel-audits
    encoding: otlp_json
    protocol_version: 2.6.0
  prometheus:
    endpoint: '0.0.0.0:8889'
  # prometheusremotewrite:
  #   endpoint: 'http://prometheus:9090/api/v1/write'
service:
  # telemetry:
  #   logs:
  #     level: "debug"
  #   metrics:
  #     level: "normal"
  extensions: [ pprof, zpages, health_check ]
  pipelines:
    logs/in:
      receivers: [ otlp, fluentforward ]
      processors: [ transform/extract-resource ]
      exporters: [ routing ]
    logs/audit:
      receivers: [ routing ]
      processors: [ memory_limiter, batch ]
      exporters: [ clickhouse/audit ]
    logs/filter-alert:
      receivers: [ routing ]
      processors: [ memory_limiter, batch ]
      exporters: [ clickhouse/otel_filter_alert_logs ]
    logs/log:
      receivers: [ routing ]
      processors: [ memory_limiter, batch ]
      exporters: [ clickhouse/default ]
    logs/kafka-log:
      receivers: [ routing ]
      processors: [ memory_limiter ]
      exporters: [ kafka/logs ]
    logs/kafka-audit:
      receivers: [ routing ]
      processors: [ memory_limiter ]
      exporters: [ kafka/audits ]
    traces:
      receivers: [ otlp ]
      processors: [ memory_limiter, batch ]
      exporters: [ clickhouse/default ]
    metrics/in:
      receivers: [ otlp ]
      processors: [ memory_limiter, batch ]
      exporters: [ clickhouse/default, kafka/metrics ]
