user nginx;
# Pinned, not "auto": "auto" counts the host's cores (6 on the Gecko VMs), not
# the container's CPU limit, and opens one reuseport socket per worker. The
# kernel hashes each sender onto one socket, so a few high-volume senders
# overflow their socket while the others sit idle (measured per-socket drops:
# 2.6M / 398k / 342k / 0 / 0 / 0). Two workers means two well-fed queues.
# See dolusoft/gecko-setup#7.
worker_processes 2;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    # Per-packet access logging is OFF on purpose. Syslog ingestion is the
    # product's main data path: one log line per UDP datagram measured ~26 KB/s
    # (~2 GB/day) on a single tenant, unbounded and unrotated, while telling us
    # nothing useful (the stream format carries no $upstream_addr, so it cannot
    # even say which listener a packet went to). Upstream failures still show up
    # in error_log above. See dolusoft/gecko-project-backend#450.
    access_log off;

    # Docker internal DNS — lazy resolution so nginx starts even if the
    # listeners are not yet up (they live in a separate compose file).
    # Without this, nginx aborts at startup with "host not found in upstream".
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upstream for UDP port 514
    upstream listener_514_udp {
        zone listener_514_udp 64k;   # "resolve" requires a shared memory zone
        random two least_conn;
        server listener-1:514 resolve max_fails=3 fail_timeout=30s;
        server listener-2:514 resolve max_fails=3 fail_timeout=30s;
    }

    # Upstream for TCP port 514
    upstream listener_514_tcp {
        zone listener_514_tcp 64k;   # "resolve" requires a shared memory zone
        random two least_conn;
        server listener-1:514 resolve max_fails=3 fail_timeout=30s;
        server listener-2:514 resolve max_fails=3 fail_timeout=30s;
    }

    # UDP 514 load balancer
    server {
        # rcvbuf=8m: without it each socket falls back to net.core.rmem_default
        # (208 KB, ~350 packets) and overflows under ordinary load. The kernel
        # doubles the value, so each socket gets 16 MB (~27 s of average
        # traffic), 32 MB for both workers. It is capped by the HOST sysctl
        # net.core.rmem_max -- raise that first, or this is silently clamped.
        # Socket memory is charged to the container's memory limit (cgroup v2).
        listen 514 udp reuseport rcvbuf=8m;
        proxy_pass listener_514_udp;
        proxy_timeout 10s;
        proxy_bind $remote_addr transparent;
        proxy_responses 0;
        proxy_buffer_size 65536;
    }

    # TCP 514 load balancer
    server {
        listen 514 reuseport;
        proxy_pass listener_514_tcp;
        proxy_timeout 10s;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        proxy_buffer_size 65536;
    }
}
